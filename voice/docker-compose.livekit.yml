# LiveKit Server — Local Development Configuration
# Run with: docker compose -f voice/docker-compose.livekit.yml up -d
#
# This starts the local LiveKit server on localhost:7880 and 7881.
# It uses development-only credentials in voice/livekit-config.dev.yaml.
# Do not use this compose file or configuration as your production deployment.
#
# For production, create voice/livekit-config.yaml from
# voice/livekit-config.production.example.yaml and provide real credentials.

services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: nexa-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"       # WebSocket — clients connect here
      - "7881:7881"       # TURN/TCP  — WebRTC fallback
      - "50100-50200:50100-50200/udp"  # WebRTC UDP media range
    command: >
      --config /etc/livekit/config.yaml
      --node-ip=127.0.0.1
    volumes:
      - ./livekit-config.dev.yaml:/etc/livekit/config.yaml:ro
    networks:
      - nexa-voice

networks:
  nexa-voice:
    driver: bridge
