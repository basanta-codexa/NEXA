name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexa_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: nexa_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/nexa_ci
      JWT_SECRET_KEY: ci-only-secret-key
      JWT_ALGORITHM: HS256

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint tests
        run: ruff check tests

      - name: Check application syntax and undefined names
        run: ruff check . --select E9,F63,F7,F82

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check migration drift
        run: alembic check

      - name: Run tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t nexa:ci .
