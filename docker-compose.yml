# Production deployment for NEXA
# Use with an environment file or exported variables containing real secrets.
#
# Required:
#   POSTGRES_PASSWORD       Strong PostgreSQL password
#   JWT_SECRET_KEY          Strong random JWT secret
#   CORS_ORIGINS            Comma-separated production origins (never "*")
#   LIVEKIT_URL             Production LiveKit WebSocket URL
#   LIVEKIT_API_KEY         Production LiveKit API key
#   LIVEKIT_API_SECRET      Production LiveKit API secret
#
# Example:
#   docker compose --env-file .env.production up --build
#
# Local development defaults are intentionally unavailable here.
# For local development, use docker-compose.dev.yml instead.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-nexa}"
      POSTGRES_USER: "${POSTGRES_USER:-nexa}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    # No database port is published. The API reaches it over the internal network.
    volumes:
      - nexa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: "${POSTGRES_DB:-nexa}"
      DB_USER: "${POSTGRES_USER:-nexa}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}"
      CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS must be set to production origins}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LIVEKIT_URL: "${LIVEKIT_URL:?LIVEKIT_URL must be set}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}"
      LIVEKIT_TOKEN_TTL_SECONDS: "${LIVEKIT_TOKEN_TTL_SECONDS:-3600}"
    ports:
      # Bind to localhost by default; put a reverse proxy in front for public traffic.
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed_rbac &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  nexa_pgdata:
